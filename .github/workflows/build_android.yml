name: Build Victorious MARKET Android Apps

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch: # Allows you to trigger the build manually from the GitHub webpage

jobs:
  detect-changes:
    name: Detect Changed Apps
    runs-on: ubuntu-latest
    outputs:
      user_app: ${{ steps.filter.outputs.user_app }}
      vendor_app: ${{ steps.filter.outputs.vendor_app }}
      delivery_app: ${{ steps.filter.outputs.delivery_app }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Filter Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            user_app:
              - 'User app/**'
            vendor_app:
              - 'Vendor app/**'
            delivery_app:
              - 'Delivery Man App/**'

  build-customer:
    name: Build Customer App
    needs: detect-changes
    if: needs.detect-changes.outputs.user_app == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          echo "Freeing up disk space on runner..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf /usr/share/swift

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'

      - name: Get Dependencies
        run: |
          cd "User app"
          flutter pub get

      - name: Run Tests
        run: |
          cd "User app"
          flutter test || echo "No tests found or tests failed, continuing..."

      - name: Configure Keystore
        run: |
          cd "User app/android"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/upload-keystore.jks
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> key.properties
          echo "storeFile=upload-keystore.jks" >> key.properties

      - name: Build APK and App Bundle
        run: |
          cd "User app"
          flutter build apk --release --no-pub
          flutter build appbundle --release --no-pub

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Customer-App-APK
          path: User app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload App Bundle (AAB) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Customer-App-AAB
          path: User app/build/app/outputs/bundle/release/app-release.aab

  build-vendor:
    name: Build Vendor App
    needs: detect-changes
    if: needs.detect-changes.outputs.vendor_app == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          echo "Freeing up disk space on runner..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf /usr/share/swift

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'

      - name: Get Dependencies
        run: |
          cd "Vendor app"
          flutter pub get

      - name: Run Tests
        run: |
          cd "Vendor app"
          flutter test || echo "No tests found or tests failed, continuing..."

      - name: Configure Keystore
        run: |
          cd "Vendor app/android"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/upload-keystore.jks
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> key.properties
          echo "storeFile=upload-keystore.jks" >> key.properties

      - name: Build APK and App Bundle
        run: |
          cd "Vendor app"
          flutter build apk --release --no-pub
          flutter build appbundle --release --no-pub

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vendor-App-APK
          path: Vendor app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload App Bundle (AAB) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vendor-App-AAB
          path: Vendor app/build/app/outputs/bundle/release/app-release.aab

  build-delivery:
    name: Build Delivery App
    needs: detect-changes
    if: needs.detect-changes.outputs.delivery_app == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          echo "Freeing up disk space on runner..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf /usr/share/swift

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'

      - name: Get Dependencies
        run: |
          cd "Delivery Man App"
          flutter pub get

      - name: Run Tests
        run: |
          cd "Delivery Man App"
          flutter test || echo "No tests found or tests failed, continuing..."

      - name: Configure Keystore
        run: |
          cd "Delivery Man App/android"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/upload-keystore.jks
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> key.properties
          echo "storeFile=upload-keystore.jks" >> key.properties

      - name: Build APK and App Bundle
        run: |
          cd "Delivery Man App"
          flutter build apk --release --no-pub
          flutter build appbundle --release --no-pub

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Delivery-App-APK
          path: Delivery Man App/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload App Bundle (AAB) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Delivery-App-AAB
          path: Delivery Man App/build/app/outputs/bundle/release/app-release.aab

  publish-release:
    name: Publish GitHub Release
    needs: [build-customer, build-vendor, build-delivery]
    if: always() && (needs.build-customer.result == 'success' || needs.build-vendor.result == 'success' || needs.build-delivery.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Customer APK
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Customer-App-APK
          path: release-assets/customer-apk

      - name: Download Customer AAB
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Customer-App-AAB
          path: release-assets/customer-aab

      - name: Download Vendor APK
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Vendor-App-APK
          path: release-assets/vendor-apk

      - name: Download Vendor AAB
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Vendor-App-AAB
          path: release-assets/vendor-aab

      - name: Download Delivery APK
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Delivery-App-APK
          path: release-assets/delivery-apk

      - name: Download Delivery AAB
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Delivery-App-AAB
          path: release-assets/delivery-aab

      - name: Organize and Rename Binaries
        run: |
          mkdir -p final-release-binaries
          [ -f release-assets/customer-apk/app-release.apk ] && cp release-assets/customer-apk/app-release.apk final-release-binaries/VictoriousMarket-CustomerApp.apk || true
          [ -f release-assets/customer-aab/app-release.aab ] && cp release-assets/customer-aab/app-release.aab final-release-binaries/VictoriousMarket-CustomerApp.aab || true
          [ -f release-assets/vendor-apk/app-release.apk ] && cp release-assets/vendor-apk/app-release.apk final-release-binaries/VictoriousMarket-VendorApp.apk || true
          [ -f release-assets/vendor-aab/app-release.aab ] && cp release-assets/vendor-aab/app-release.aab final-release-binaries/VictoriousMarket-VendorApp.aab || true
          [ -f release-assets/delivery-apk/app-release.apk ] && cp release-assets/delivery-apk/app-release.apk final-release-binaries/VictoriousMarket-DeliveryApp.apk || true
          [ -f release-assets/delivery-aab/app-release.aab ] && cp release-assets/delivery-aab/app-release.aab final-release-binaries/VictoriousMarket-DeliveryApp.aab || true
          ls -la final-release-binaries/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-release
          name: "Victorious MARKET — Latest Android Builds (APKs & AABs)"
          body: |
            ## 🛒 Victorious MARKET — Latest Android Releases
            
            Download the latest release binaries directly below:
            
            ### 📱 Direct Download APKs:
            * **Customer App:** `VictoriousMarket-CustomerApp.apk`
            * **Vendor App:** `VictoriousMarket-VendorApp.apk`
            * **Delivery Rider App:** `VictoriousMarket-DeliveryApp.apk`
            
            ### 📦 Google Play Store Bundles:
            * `VictoriousMarket-CustomerApp.aab`
            * `VictoriousMarket-VendorApp.aab`
            * `VictoriousMarket-DeliveryApp.aab`
            
            *Compiled automatically by Victorious MARKET GitHub Actions CI/CD.*
          draft: false
          prerelease: false
          files: final-release-binaries/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

